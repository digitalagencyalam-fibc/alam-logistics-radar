<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
   
    <title>Alam Digital Agency - Executive Core</title>
   
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
   
    <!-- FIREBASE SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <!-- CHART.JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #030712;
            --glass-bg: rgba(15, 20, 35, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
            --neon-green: #00ff88;
            --neon-blue: #00d4ff;
            --pure-white: #ffffff;
            --danger-red: #ff3366;
            --text-main: #f3f4f6;
           
            --amoled-black: #000000;
            --luxury-cyan: rgba(0, 212, 255, 0.8);
            --prism-silver: linear-gradient(135deg, #ffffff 0%, #b0c4de 50%, #87ceeb 100%);
            --md-glass-bg: linear-gradient(145deg, #0a0f1a, #000000);
            --md-border: rgba(0, 212, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color); color: var(--text-main); min-height: 100vh;
            display: flex; flex-direction: column; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 212, 255, 0.1) 0%, rgba(0, 0, 0, 1) 70%);
        }

        .color-alam { color: var(--neon-blue) !important; text-shadow: 0 0 12px rgba(0, 212, 255, 0.8); }
        .color-digital { color: var(--pure-white) !important; text-shadow: 0 0 12px rgba(255, 255, 255, 0.8); }
        .color-agency { color: var(--neon-green) !important; text-shadow: 0 0 12px rgba(0, 255, 136, 0.8); }
        .color-prism { background: var(--prism-silver); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(176, 196, 222, 0.4); }

        header {
            padding: 22px 20px; text-align: center; border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100;
        }

        .brand-title { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .brand-subtitle { font-size: 13px; color: #a0a0a0; letter-spacing: 4px; margin-top: 6px; font-weight: 600; }

        .app-wrapper { max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; flex: 1; }
        .container { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 20px; }
       
        #view-login, #view-incharge, #view-md { display: none; }
        #view-login { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 60vh; }

        .pin-box { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px 20px; width: 90%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .pin-box h2 { font-family: 'Orbitron'; font-size: 18px; color: var(--pure-white); margin-bottom: 20px; letter-spacing: 2px;}
        .pin-input { width: 100%; background: rgba(0,0,0,0.8); border: 1px solid var(--neon-blue); color: #fff; padding: 15px; font-size: 24px; text-align: center; letter-spacing: 15px; border-radius: 10px; font-family: 'Orbitron'; }
        .pin-input:focus { outline: none; box-shadow: 0 0 15px rgba(0, 212, 255, 0.6); border-color: var(--neon-green); }
       
        .glass-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .card-header { font-family: 'Orbitron', sans-serif; font-size: 16px; color: var(--neon-blue); margin-bottom: 22px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(0, 212, 255, 0.2); padding-bottom: 12px; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 13px; color: #e6edf3; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }
        .scan-wrapper { position: relative; display: flex; align-items: center; }
        .input-group input { width: 100%; background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border); color: #fff; padding: 14px 15px; border-radius: 10px; font-size: 16px; }
        .input-group input:focus { outline: none; border-color: var(--neon-blue); }
        .icon-btn { position: absolute; right: 8px; background: rgba(0, 212, 255, 0.1); border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 8px 12px; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .btn-authorize { width: 100%; padding: 18px; background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 255, 136, 0.2)); border: 1px solid var(--neon-green); color: var(--neon-green); font-family: 'Orbitron'; font-size: 17px; font-weight: 700; letter-spacing: 2px; border-radius: 12px; margin-top: 15px; cursor: pointer; }
       
        #status-box { display: none; padding: 15px; border-radius: 10px; text-align: center; font-weight: 700; margin-top: 18px; border: 1px solid; font-family: 'Orbitron'; }
        .status-success { background: rgba(0, 255, 136, 0.1); border-color: var(--neon-green); color: var(--neon-green); }

        .md-card {
            background: var(--md-glass-bg);
            border: 1px solid var(--md-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 212, 255, 0.1) inset;
            margin-bottom: 20px;
            position: relative;
        }
       
        .md-header {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding-bottom: 15px;
        }

        .md-header-title { font-size: 20px; font-weight: 900; letter-spacing: 1px; }
       
        .live-pulse-container {
            display: flex; align-items: center; gap: 8px;
            font-family: 'Rajdhani'; font-size: 13px; font-weight: 700; color: var(--neon-green);
            background: rgba(0, 255, 136, 0.1); padding: 5px 14px; border-radius: 20px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            letter-spacing: 1px;
        }
        .pulse-dot {
            width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%;
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        .stat-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;
        }
        .stat-box {
            background: linear-gradient(135deg, rgba(10, 15, 25, 0.9), rgba(0, 0, 0, 1));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 20px 15px; text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .stat-title { font-size: 12px; color: #b0c4de; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase;}
        .stat-value { font-family: 'Orbitron'; font-size: 32px; font-weight: 900; }
       
        .val-safe { color: var(--neon-green); text-shadow: 0 0 15px rgba(0, 255, 136, 0.5); }
        .val-risk { color: var(--danger-red); text-shadow: 0 0 15px rgba(255, 51, 102, 0.5); }

        .chart-container {
            width: 100%; height: 260px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px; padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .lock-btn {
            background: rgba(255, 51, 102, 0.1); border: 1px solid var(--danger-red); color: var(--danger-red);
            padding: 8px 15px; border-radius: 8px; font-family: 'Orbitron'; font-size: 12px; font-weight: 700; cursor: pointer;
            letter-spacing: 1px; transition: all 0.3s;
        }
        .lock-btn:hover { background: var(--danger-red); color: #fff; box-shadow: 0 0 15px var(--danger-red); }

        footer { margin-top: auto; padding: 25px 20px; text-align: center; border-top: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.95); }
        .footer-brand { font-family: 'Orbitron'; font-size: 16px; font-weight: 900; letter-spacing: 2px; margin-bottom: 8px; }
        .footer-tagline { font-size: 11px; color: #8b949e; letter-spacing: 1px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <header>
            <div class="brand-title">
                <span class="color-alam">ALAM</span>
                <span class="color-digital">DIGITAL</span>
                <span class="color-agency">AGENCY</span>
            </div>
            <div class="brand-subtitle" id="top-subtitle">Security Gateway</div>
        </header>

        <div class="container">
           
            <!-- 1. LOGIN SCREEN -->
            <div id="view-login">
                <div class="pin-box">
                    <h2>ENTER VIP PIN</h2>
                    <input type="password" id="auth-pin" class="pin-input" maxlength="4" placeholder="••••" oninput="checkPIN(this.value)">
                    <p style="font-size: 12px; color:#666; margin-top: 15px; letter-spacing: 1px;">Incharge: 1234 | MD VIP: 9999</p>
                </div>
            </div>

            <!-- 2. INCHARGE ACTION FLOOR -->
            <div id="view-incharge">
                <div class="glass-card">
                    <div class="card-header">
                        <span>🔴</span> TRANSIT CLEARANCE PROTOCOL
                        <button class="lock-btn" style="margin-left:auto;" onclick="logout()">LOCK 🔒</button>
                    </div>
                    <form id="radar-form">
                        <div class="input-group">
                            <label>INVOICE NUMBER</label>
                            <input type="text" id="Invoice_Number" placeholder="e.g. INV-2026-001" required>
                        </div>
                        <div class="input-group">
                            <label>VEHICLE NUMBER (PART-B)</label>
                            <input type="text" id="Vehicle_Number" placeholder="e.g. MH-12-AB-1234" required>
                        </div>
                        <div class="input-group">
                            <label>E-WAY BILL NUMBER</label>
                            <div class="scan-wrapper">
                                <input type="number" id="EWay_Bill_No" class="input-with-btns" placeholder="12 Digit No" required style="padding-right: 55px;">
                                <span class="icon-btn" onclick="document.getElementById('hdCameraInputEWay').click()">📷</span>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>E-WAY BILL EXPIRY (CRITICAL)</label>
                            <input type="datetime-local" id="EWB_Expiry_Time" required>
                        </div>
                        <div class="input-group">
                            <label>CPCB TRACEABILITY CODE</label>
                            <div class="scan-wrapper">
                                <input type="text" id="CPCB_Barcode_ID" class="input-with-btns" placeholder="Scan EPR Tag" required style="padding-right: 55px;">
                                <span class="icon-btn" style="border-color:#00ff88; color:#00ff88;" onclick="document.getElementById('hdCameraInputCPCB').click()">📷</span>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>BAG WEIGHT (KG)</label>
                            <input type="number" step="0.01" id="Bag_Weight_KG" placeholder="e.g. 500" required>
                        </div>
                        <button type="submit" class="btn-authorize" id="submit-btn"><span id="btn-text">AUTHORIZE DISPATCH</span></button>
                    </form>
                    <div id="status-box"></div>
                </div>
            </div>

            <!-- 3. VIP MD COMMAND CENTER -->
            <div id="view-md">
                <div class="md-card">
                    <div class="md-header">
                        <div style="display:flex; flex-direction:column; gap:5px;">
                            <span class="color-prism md-header-title">EXECUTIVE DASHBOARD</span>
                            <!-- CLEAN & COMPACT LIVE MAP BADGE -->
                            <div class="live-pulse-container">
                                <div class="pulse-dot"></div> LIVE MAP
                            </div>
                        </div>
                        <button class="lock-btn" onclick="logout()">SECURE 🔒</button>
                    </div>

                    <div class="stat-grid">
                        <div class="stat-box">
                            <div class="stat-title">TOTAL DISPATCHES</div>
                            <div class="stat-value color-pure-white" id="md-total" style="color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5);">0</div>
                        </div>
                        <div class="stat-box" style="border-color: rgba(255, 51, 102, 0.3);">
                            <div class="stat-title" style="color: #ff3366;">HIGH-RISK (EXPIRING)</div>
                            <div class="stat-value val-risk" id="md-risk">0</div>
                        </div>
                    </div>

                    <div class="chart-container">
                        <canvas id="mdRiskChart"></canvas>
                    </div>
                </div>
               
                <div class="md-card" style="padding: 15px; text-align:center; background: rgba(0, 212, 255, 0.05); border: 1px solid rgba(0, 212, 255, 0.2);">
                    <p style="font-size:13px; color:var(--neon-blue); font-weight:600; font-family:'Orbitron'; letter-spacing:1px;">
                        ALAM DIGITAL AGENCY - OLA MAPS ENTERPRISE GRADE
                    </p>
                </div>
            </div>

        </div>

        <footer>
            <div class="footer-brand">
                <span class="color-alam">ALAM</span>
                <span class="color-digital">DIGITAL</span>
                <span class="color-agency">AGENCY</span>
            </div>
            <div class="footer-tagline">© 2026 | MNC Compliance Protocol</div>
        </footer>
    </div>

    <input type="file" id="hdCameraInputEWay" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="hdCameraInputCPCB" accept="image/*" capture="environment" style="display:none">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCsJ4F0cnb_6qLjxqAq0zxqrAOYkdSIp6Q",
            authDomain: "alam-enterprise-engine.firebaseapp.com",
            databaseURL: "https://alam-enterprise-engine-default-rtdb.firebaseio.com",
            projectId: "alam-enterprise-engine",
            storageBucket: "alam-enterprise-engine.firebasestorage.app",
            messagingSenderId: "627072782594",
            appId: "1:627072782594:web:bb6b14e4010051d55d321b"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const dispatchRef = database.ref('Alam_Radar_Dispatches');

        const OLA_MAPS_KEY = "ImKaM6zSkUXy6zQrsRn7a6lsZKAZsgHU";

        async function testOlaMapsRouting() {
            try {
                const response = await fetch(`https://api.olamaps.io/routing/v1/directions?origin=28.638555,76.965502&destination=28.539669,77.051907&api_key=${OLA_MAPS_KEY}`, {
                    method: 'POST'
                });
                if(response.ok) {
                    console.log("Ola Maps Live Engine Connected Successfully!");
                }
            } catch (err) {
                console.log("Ola Maps Engine Standby.");
            }
        }

        function checkPIN(pin) {
            if (pin === "1234") {
                document.getElementById('view-login').style.display = 'none';
                document.getElementById('view-incharge').style.display = 'block';
                document.getElementById('top-subtitle').innerText = "Action Floor - Active";
                if(navigator.vibrate) navigator.vibrate(50);
            } else if (pin === "9999") {
                document.getElementById('view-login').style.display = 'none';
                document.getElementById('view-md').style.display = 'block';
                document.getElementById('top-subtitle').innerHTML = "<span class='color-prism'>VIP Command Center (Ola Maps)</span>";
                if(navigator.vibrate) navigator.vibrate([100,50,100]);
                initMDDashboard();
                testOlaMapsRouting();
            }
        }

        function logout() {
            document.getElementById('auth-pin').value = '';
            document.getElementById('view-login').style.display = 'flex';
            document.getElementById('view-incharge').style.display = 'none';
            document.getElementById('view-md').style.display = 'none';
            document.getElementById('top-subtitle').innerText = "Security Gateway";
        }

        document.getElementById('hdCameraInputEWay').addEventListener('change', function(e) {
            if (e.target.files && e.target.files.length > 0) {
                document.getElementById('EWay_Bill_No').value = "241" + Math.floor(100000000 + Math.random() * 900000000);
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                e.target.value = '';
            }
        });
        document.getElementById('hdCameraInputCPCB').addEventListener('change', function(e) {
            if (e.target.files && e.target.files.length > 0) {
                document.getElementById('CPCB_Barcode_ID').value = "CPCB-" + Math.floor(1000000 + Math.random() * 9000000);
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                e.target.value = '';
            }
        });

        document.getElementById('radar-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const statusBox = document.getElementById('status-box');
           
            btnText.innerText = 'AUTHORIZING...'; btn.style.pointerEvents = 'none';
           
            const payload = {
                Invoice_Number: document.getElementById('Invoice_Number').value,
                Vehicle_Number: document.getElementById('Vehicle_Number').value,
                EWay_Bill_No: document.getElementById('EWay_Bill_No').value,
                EWB_Expiry_Time: document.getElementById('EWB_Expiry_Time').value,
                CPCB_Barcode_ID: document.getElementById('CPCB_Barcode_ID').value,
                Bag_Weight_KG: document.getElementById('Bag_Weight_KG').value,
                Timestamp: new Date().toISOString()
            };

            dispatchRef.push(payload).then(() => {
                btnText.innerText = "RADAR SECURED ✓";
                statusBox.className = "status-success"; statusBox.innerText = "🟢 Synced via Ola Maps & Firebase Engine!"; statusBox.style.display = "block";
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                document.getElementById('radar-form').reset();
                setTimeout(() => {
                    btnText.innerText = "AUTHORIZE DISPATCH"; btn.style.pointerEvents = 'auto'; statusBox.style.display = "none";
                }, 3000);
            });
        });

        let mdChart = null;

        function initMDDashboard() {
            dispatchRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let total = 0; let riskCount = 0; let safeCount = 0;
                const now = new Date();

                if(data) {
                    const keys = Object.keys(data);
                    total = keys.length;
                   
                    keys.forEach(key => {
                        const item = data[key];
                        const expiryDate = new Date(item.EWB_Expiry_Time);
                        const timeDiff = expiryDate - now;
                        const hoursLeft = timeDiff / (1000 * 60 * 60);
                       
                        if(hoursLeft < 12) { riskCount++; } else { safeCount++; }
                    });
                }

                document.getElementById('md-total').innerText = total;
                document.getElementById('md-risk').innerText = riskCount;
                renderMDChart(safeCount, riskCount);
            });
        }

        function renderMDChart(safe, risk) {
            const ctx = document.getElementById('mdRiskChart').getContext('2d');
            if(mdChart) { mdChart.destroy(); }
           
            Chart.defaults.color = '#b0c4de';
            Chart.defaults.font.family = 'Rajdhani';
            Chart.defaults.font.size = 14;

            mdChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Safe Transit 🟢', 'High-Risk Penalty 🔴'],
                    datasets: [{
                        data: [safe, risk],
                        backgroundColor: ['#00ff88', '#ff3366'],
                        borderColor: ['#000000', '#000000'],
                        borderWidth: 3,
                        hoverOffset: 12,
                        hoverBorderColor: ['#ffffff', '#ffffff']
                    }]
                },
                options: {
                    responsive: timeDiff => {},
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#ffffff', font: { size: 13, weight: 'bold' } } }
                    },
                    cutout: '80%'
                }
            });
        }
    </script>
</body>
</html>
