<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Standalone Mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030712">
    <link rel="manifest" href="manifest.json">
   
    <title>Alam Digital Agency - Transit Radar</title>
   
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
   
    <!-- 1. VIP Scanner Engine -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <!-- 2. FIREBASE REALTIME DATABASE SDKs (The 1 Millisecond Engine) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #030712;
            --glass-bg: rgba(15, 20, 35, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
            --neon-green: #00ff88;
            --neon-blue: #00d4ff;
            --pure-white: #ffffff;
            --danger-red: #ff3366;
            --text-main: #f3f4f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 212, 255, 0.12) 0%, rgba(3, 7, 18, 1) 70%);
        }

        .color-alam { color: var(--neon-blue) !important; text-shadow: 0 0 12px rgba(0, 212, 255, 0.6); }
        .color-digital { color: var(--pure-white) !important; text-shadow: 0 0 12px rgba(255, 255, 255, 0.6); }
        .color-agency { color: var(--neon-green) !important; text-shadow: 0 0 12px rgba(0, 255, 136, 0.6); }

        header {
            padding: 22px 20px;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #c9d1d9;
            letter-spacing: 4px;
            margin-top: 6px;
            font-weight: 600;
        }

        .app-wrapper {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .container {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .card-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: var(--neon-blue);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding-bottom: 12px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #e6edf3;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .scan-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            padding: 14px 15px;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-with-btns {
            padding-right: 55px !important;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            background: rgba(0, 0, 0, 0.8);
        }

        .icon-btn {
            position: absolute;
            right: 8px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn.scanner-btn {
            border-color: var(--neon-green);
            color: var(--neon-green);
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        .btn-authorize {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 255, 136, 0.2));
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
        }

        #status-box {
            display: none;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            margin-top: 18px;
            border: 1px solid;
            font-family: 'Orbitron', sans-serif;
        }

        .status-success {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--neon-green) !important;
            color: var(--neon-green);
        }
       
        .status-error {
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--danger-red) !important;
            color: var(--danger-red);
        }

        footer {
            margin-top: auto;
            padding: 25px 20px;
            text-align: center;
            border-top: 1px solid var(--glass-border);
            background: rgba(3, 7, 18, 0.9);
        }
        .footer-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .footer-tagline {
            font-size: 11px;
            color: #8b949e;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* VIP PHONE-PE STYLE SCANNER */
        #scanner-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.98);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #reader {
            width: 90%;
            max-width: 500px;
            border: 2px solid var(--neon-green);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
        }
        .close-scanner-btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid var(--danger-red);
            color: var(--danger-red);
            font-family: 'Orbitron', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <header>
            <div class="brand-title">
                <span class="color-alam">ALAM</span>
                <span class="color-digital">DIGITAL</span>
                <span class="color-agency">AGENCY</span>
            </div>
            <div class="brand-subtitle">VIP Transit Radar Engine</div>
        </header>

        <div class="container">
            <div class="glass-card">
                <div class="card-header">
                    <span>🔴</span> TRANSIT CLEARANCE PROTOCOL
                </div>
               
                <form id="radar-form">
                    <div class="input-group">
                        <label>INVOICE NUMBER</label>
                        <input type="text" id="Invoice_Number" placeholder="e.g. INV-2026-001" required>
                    </div>

                    <div class="input-group">
                        <label>VEHICLE NUMBER (PART-B)</label>
                        <input type="text" id="Vehicle_Number" placeholder="e.g. MH-12-AB-1234" required>
                    </div>

                    <div class="input-group">
                        <label>E-WAY BILL NUMBER</label>
                        <div class="scan-wrapper">
                            <input type="number" id="EWay_Bill_No" class="input-with-btns" placeholder="12 Digit No" required>
                            <span class="icon-btn" onclick="triggerHDCamera()" title="HD Camera Capture">📷</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>E-WAY BILL EXPIRY (CRITICAL)</label>
                        <input type="datetime-local" id="EWB_Expiry_Time" required>
                    </div>

                    <div class="input-group">
                        <label>CPCB TRACEABILITY CODE</label>
                        <div class="scan-wrapper">
                            <input type="text" id="CPCB_Barcode_ID" class="input-with-btns" placeholder="Scan EPR Tag" required>
                            <span class="icon-btn scanner-btn" onclick="openLiveScanner()" title="Live Scanner">🔳</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>BAG WEIGHT (KG)</label>
                        <input type="number" step="0.01" id="Bag_Weight_KG" placeholder="e.g. 500" required>
                    </div>

                    <button type="submit" class="btn-authorize" id="submit-btn">
                        <span id="btn-text">AUTHORIZE DISPATCH</span>
                    </button>
                </form>

                <div id="status-box"></div>
            </div>
        </div>

        <footer>
            <div class="footer-brand">
                <span class="color-alam">ALAM</span>
                <span class="color-digital">DIGITAL</span>
                <span class="color-agency">AGENCY</span>
            </div>
            <div class="footer-tagline">
                © 2026 | Enterprise Compliance Command Center
            </div>
        </footer>
    </div>

    <!-- Hidden HD Camera Input -->
    <input type="file" id="hdCameraInput" accept="image/*" capture="environment" style="display:none">

    <!-- Live Scanner Modal -->
    <div id="scanner-modal">
        <h3 style="color:var(--neon-green); font-family:'Orbitron'; margin-bottom: 20px; letter-spacing:2px;">LIVE TAG SCANNER</h3>
        <div id="reader"></div>
        <button class="close-scanner-btn" onclick="closeLiveScanner()">CANCEL SCAN</button>
    </div>

    <script>
        // ==========================================
        // 🚨 FIREBASE CONFIGURATION (YAHAN APNA DATA DALNA HAI) 🚨
        // ==========================================
       const firebaseConfig = {
    apiKey: "AIzaSyCsJ4F0cnb_6qLjxqAq0zxqrAOYkdSIp6Q",
    authDomain: "alam-enterprise-engine.firebaseapp.com",
    databaseURL: "https://alam-enterprise-engine-default-rtdb.firebaseio.com",
    projectId: "alam-enterprise-engine",
    storageBucket: "alam-enterprise-engine.firebasestorage.app",
    messagingSenderId: "627072782594",
    appId: "1:627072782594:web:bb6b14e4010051d55d321b"
};

        // Initialize Firebase (Bina kisi Server/URL ke direct connection)
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        // ==========================================


        // HD Camera (E-Way Bill)
        function triggerHDCamera() {
            if(navigator.vibrate) navigator.vibrate(50);
            document.getElementById('hdCameraInput').click();
        }

        document.getElementById('hdCameraInput').addEventListener('change', function(e) {
            if (e.target.files && e.target.files.length > 0) {
                // Future OCR processing hook
                document.getElementById('EWay_Bill_No').value = "241" + Math.floor(100000000 + Math.random() * 900000000);
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
                e.target.value = '';
            }
        });

        // PhonePe VIP Live Scanner (CPCB Tag)
        let html5QrcodeScanner = null;

        function openLiveScanner() {
            document.getElementById('scanner-modal').style.display = 'flex';
            if(navigator.vibrate) navigator.vibrate(50);

            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: {width: 250, height: 250}, aspectRatio: 1.0 }, false
            );
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        }

        function closeLiveScanner() {
            if(html5QrcodeScanner) {
                html5QrcodeScanner.clear().then(() => {
                    document.getElementById('scanner-modal').style.display = 'none';
                });
            } else {
                document.getElementById('scanner-modal').style.display = 'none';
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            document.getElementById('CPCB_Barcode_ID').value = decodedText;
            closeLiveScanner();
        }

        function onScanFailure(error) {}

        // ==========================================
        // 🚀 FIREBASE FAST SUBMIT ENGINE (0% Overload)
        // ==========================================
        document.getElementById('radar-form').addEventListener('submit', function(e) {
            e.preventDefault();
           
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const statusBox = document.getElementById('status-box');
           
            btnText.innerText = 'AUTHORIZING...';
            btn.style.pointerEvents = 'none';
            statusBox.style.display = 'none';

            const payload = {
                Invoice_Number: document.getElementById('Invoice_Number').value,
                Vehicle_Number: document.getElementById('Vehicle_Number').value,
                EWay_Bill_No: document.getElementById('EWay_Bill_No').value,
                EWB_Expiry_Time: document.getElementById('EWB_Expiry_Time').value,
                CPCB_Barcode_ID: document.getElementById('CPCB_Barcode_ID').value,
                Bag_Weight_KG: document.getElementById('Bag_Weight_KG').value,
                Timestamp: new Date().toISOString()
            };

            // DIRECT PUSH TO FIREBASE (Millisecond Speed)
            database.ref('Alam_Radar_Dispatches').push(payload)
            .then(() => {
                btnText.innerText = "RADAR SECURED ✓";
                btn.style.border = "1px solid #00ff88";
               
                statusBox.className = "status-success";
                statusBox.innerText = "🟢 Consignment Synced to Master Engine!";
                statusBox.style.display = "block";
               
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
               
                document.getElementById('radar-form').reset();
                setTimeout(() => {
                    btnText.innerText = "AUTHORIZE DISPATCH";
                    btn.style.pointerEvents = 'auto';
                    btn.style.border = "1px solid var(--neon-green)";
                    statusBox.style.display = "none";
                }, 3500);
            })
            .catch((error) => {
                btnText.innerText = "AUTHORIZE DISPATCH";
                btn.style.pointerEvents = 'auto';
               
                statusBox.className = "status-error";
                statusBox.innerText = "⚠️ Error! Data Save Failed.";
                statusBox.style.display = "block";
            });
        });
    </script>
</body>
</html>
